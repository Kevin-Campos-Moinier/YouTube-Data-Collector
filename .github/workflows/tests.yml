name: tests

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read   # the tests need no write access and no secrets

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[all,dev]"
      - run: python -m pytest -q
